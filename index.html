<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFA Battle: Dogga clan vs. MOGG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .yt-button {
            display: inline-block;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .yt-button:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 DFA Battle 🔥</h1>
        <p>Zdravím všechny kamarády, běžte se podívat na DFA battle Dogga clan vs. MOGG je to fakt top. cs</p>
        
        <a href="https://www.youtube.com/watch?v=RW3VaqCRsdI&list=RDRW3VaqCRsdI&start_radio=1" target="_blank" rel="noopener noreferrer" class="yt-button">
            ▶ Pustit na YouTube
        </a>
    </div>

</body>
</html>
